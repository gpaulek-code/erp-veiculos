<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | Controle Car'">Controle Car</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
<style>
    :root { --sidebar-w: 220px; --sidebar-bg: #1a1a2e; --sidebar-hover: rgba(255,255,255,0.07); }

    body { margin: 0; background: #f4f6f9; }

    /* ── Sidebar ── */
    #sidebar {
        position: fixed; top: 0; left: 0;
        width: var(--sidebar-w); height: 100vh;
        background: var(--sidebar-bg);
        display: flex; flex-direction: column;
        z-index: 1000; transition: left .25s ease;
        overflow-y: auto;
    }
    #sidebar .sidebar-logo {
        display: flex; align-items: center; gap: 10px;
        padding: 1.1rem 1.2rem 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        text-decoration: none;
    }
    #sidebar .sidebar-logo i { font-size: 1.7rem; color: #ffc107; }
    #sidebar .sidebar-logo span { font-size: .92rem; font-weight: 900; color: #fff; letter-spacing: .4px; }
    #sidebar .sidebar-logo span b { color: #ffc107; }

    #sidebar nav { flex: 1; padding: .5rem 0; }

    .s-link {
        display: flex; align-items: center; gap: 12px;
        padding: .62rem 1.2rem; color: rgba(255,255,255,0.7);
        text-decoration: none; font-size: .875rem; font-weight: 500;
        transition: background .15s, color .15s;
        border-left: 3px solid transparent;
    }
    .s-link i { font-size: 1.05rem; width: 20px; text-align: center; }
    .s-link:hover { background: var(--sidebar-hover); color: #fff; }
    .s-link.active { color: #ffc107; border-left-color: #ffc107; background: rgba(255,193,7,0.08); }

    .s-divider { border-color: rgba(255,255,255,0.08); margin: .4rem .8rem; }

    /* Perfil na base */
    #sidebar .sidebar-bottom { border-top: 1px solid rgba(255,255,255,0.08); padding: .5rem 0; }
    .s-user {
        display: flex; align-items: center; gap: 10px;
        padding: .6rem 1.2rem; color: rgba(255,255,255,0.8);
        font-size: .82rem; cursor: pointer;
        transition: background .15s;
    }
    .s-user:hover { background: var(--sidebar-hover); }

    /* ── Conteúdo principal ── */
    #main-wrapper {
        margin-left: var(--sidebar-w);
        min-height: 100vh;
        display: flex; flex-direction: column;
        transition: margin-left .25s ease;
    }

    /* ── Overlay mobile ── */
    #sidebarOverlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.5); z-index: 999;
    }

    /* ── Topbar mobile ── */
    #mobile-topbar {
        display: none;
        background: var(--sidebar-bg);
        height: 52px; padding: 0 1rem;
        align-items: center; gap: 12px;
        position: sticky; top: 0; z-index: 100;
    }
    #mobile-topbar .btn-hamburger {
        background: #ffc107; border: none;
        border-radius: 7px; padding: 5px 9px;
        color: #000; font-size: 1.1rem; cursor: pointer;
    }
    #mobile-topbar .topbar-logo { font-size: .85rem; font-weight: 900; color: #fff; text-decoration: none; }
    #mobile-topbar .topbar-logo b { color: #ffc107; }

    @media (max-width: 991px) {
        #sidebar { left: calc(-1 * var(--sidebar-w)); }
        #sidebar.open { left: 0; }
        #main-wrapper { margin-left: 0; }
        #mobile-topbar { display: flex; }
    }

    /* Dropdown perfil */
    .profile-dropdown {
        position: absolute; bottom: 60px; left: 8px; right: 8px;
        background: #fff; border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        display: none; overflow: hidden; z-index: 200;
    }
    .profile-dropdown.show { display: block; }
</style>
</head>

<!-- FRAGMENT navbar = sidebar completa -->
<div th:fragment="navbar">

<!-- Topbar mobile -->
<div id="mobile-topbar">
    <a th:href="@{/}" class="text-decoration-none d-flex align-items-center gap-2" style="flex:1;">
        <i class="bi bi-car-front-fill" style="font-size:1.5rem; color:#ffc107;"></i>
        <span class="topbar-logo">CONTROLE<b>CAR</b></span>
    </a>
    <button class="btn-hamburger" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>
</div>

<!-- Overlay -->
<div id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div id="sidebar">

    <!-- Logo -->
    <a th:href="@{/}" class="sidebar-logo">
        <i class="bi bi-car-front-fill"></i>
        <span>CONTROLE<b>CAR</b></span>
    </a>

    <!-- Navegação -->
    <nav>
        <a th:href="@{/}"
           th:classappend="${currentUri == '/'} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a th:href="@{/veiculos}"
           th:classappend="${#strings.startsWith(currentUri, '/veiculos') and !#strings.startsWith(currentUri, '/veiculos/novo')} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-car-front-fill"></i> Veículos
        </a>
        <a th:href="@{/veiculos/novo}"
           th:classappend="${#strings.startsWith(currentUri, '/veiculos/novo')} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-plus-circle"></i> Novo Veículo
        </a>
        <a th:href="@{/importacao}"
           th:classappend="${#strings.startsWith(currentUri, '/importacao')} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-cloud-arrow-up-fill"></i> Importar
        </a>
    </nav>

    <!-- Perfil na base -->
    <div class="sidebar-bottom">

        <!-- Minha Conta e Suporte acima do online -->
        <a th:href="@{/perfil}"
           th:classappend="${#strings.startsWith(currentUri, '/perfil')} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-person-fill"></i> Minha Conta
        </a>
        <a th:href="@{/chamado}"
           th:classappend="${#strings.startsWith(currentUri, '/chamado')} ? 'active' : ''"
           class="s-link">
            <i class="bi bi-headset"></i> Suporte
        </a>

        <hr class="s-divider"/>

        <!-- Toggle online -->
        <div class="px-3 py-2 d-flex align-items-center gap-2">
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="switchOnline"
                       checked onchange="toggleOnline(this)" style="cursor:pointer;"/>
            </div>
            <span id="statusLabel" class="small text-success fw-semibold">
                <i class="bi bi-circle-fill me-1" style="font-size:.45rem;"></i>Online
            </span>
        </div>

        <!-- Usuário + logout -->
        <div class="s-user" onclick="toggleProfileMenu()" style="position:relative;">
            <span class="position-relative">
                <i class="bi bi-person-circle fs-5 text-white-50"></i>
                <span id="statusDot" style="position:absolute;bottom:0;right:-2px;width:7px;height:7px;
                     border-radius:50%;background:#28a745;border:1.5px solid #1a1a2e;"></span>
            </span>
            <div style="flex:1; min-width:0;">
                <div class="text-white fw-semibold text-truncate" style="font-size:.8rem;" sec:authentication="name">Usuário</div>
                <div class="text-white-50 text-truncate" style="font-size:.7rem;">Administrador</div>
            </div>
            <i class="bi bi-three-dots-vertical text-white-50" style="font-size:.8rem;"></i>
        </div>

        <!-- Mini dropdown -->
        <div class="profile-dropdown" id="profileMenu">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item d-flex align-items-center gap-2 py-2 px-3 text-danger">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </form>
        </div>

    </div>
</div><!-- fim sidebar -->

</div><!-- fim navbar fragment -->

<!-- FRAGMENT footer -->
<footer th:fragment="footer" class="bg-dark text-white-50 text-center py-3 mt-auto small">
    &copy; 2026 Controle Car &mdash; Todos os direitos reservados.
</footer>

<!-- FRAGMENT alertas -->
<div th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>


<!-- Scripts globais sidebar -->
<script th:fragment="sidebar-scripts">
    function toggleSidebar() {
        const s = document.getElementById('sidebar');
        const o = document.getElementById('sidebarOverlay');
        s.classList.toggle('open');
        o.style.display = s.classList.contains('open') ? 'block' : 'none';
        document.body.style.overflow = s.classList.contains('open') ? 'hidden' : '';
    }
    function toggleProfileMenu() {
        document.getElementById('profileMenu').classList.toggle('show');
    }
    document.addEventListener('click', function(e) {
        const menu = document.getElementById('profileMenu');
        if (menu && !e.target.closest('.s-user') && !e.target.closest('.profile-dropdown')) {
            menu.classList.remove('show');
        }
    });
    function toggleOnline(el) {
        const online = el.checked;
        const label = document.getElementById('statusLabel');
        const dot   = document.getElementById('statusDot');
        label.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size:.45rem;"></i>' + (online ? 'Online' : 'Offline');
        label.className = 'small fw-semibold ' + (online ? 'text-success' : 'text-secondary');
        dot.style.background = online ? '#28a745' : '#6c757d';
        fetch('/perfil/status', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'online=' + online + '&_csrf=' + (document.querySelector('meta[name="_csrf"]')?.content || '')
        });
    }
    // Tooltips Bootstrap
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
</script>

</html>
