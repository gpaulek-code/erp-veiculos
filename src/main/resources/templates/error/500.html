<!DOCTYPE html>

<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
