<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Minha Conta')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div id="main-wrapper">
<main class="container py-4 flex-grow-1">

    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-person-circle fs-3 text-warning me-3"></i>
        <div>
            <h2 class="mb-0 fw-bold">Minha Conta</h2>
            <small class="text-muted" th:text="${usuario?.username}"></small>
        </div>
    </div>

    <div class="row g-4">

        <!-- Dados do perfil -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold border-bottom">
                    <i class="bi bi-building me-2 text-primary"></i>Dados da Empresa
                </div>
                <div class="card-body">
                    <div th:if="${sucesso}" class="alert alert-success py-2">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
                    </div>
                    <div th:if="${erro}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
                    </div>
                    <form th:action="@{/perfil/atualizar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuário</label>
                            <input type="text" class="form-control" th:value="${usuario?.username}" disabled/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nome da Empresa</label>
                            <input type="text" name="nomeEmpresa" class="form-control"
                                   th:value="${usuario?.nomeEmpresa}" placeholder="Ex: Minha Revenda Ltda"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-mail</label>
                            <input type="email" name="email" class="form-control"
                                   th:value="${usuario?.email}" placeholder="contato@empresa.com"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Perfil</label>
                            <input type="text" class="form-control"
                                   th:value="${usuario?.role == 'ROLE_ADMIN' ? 'Administrador' : 'Usuário'}" disabled/>
                        </div>
                        <button type="submit" class="btn btn-warning fw-semibold w-100">
                            <i class="bi bi-check-circle me-2"></i>Salvar Alterações
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Alterar senha -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-semibold border-bottom">
                    <i class="bi bi-lock-fill me-2 text-danger"></i>Alterar Senha
                </div>
                <div class="card-body">
                    <div th:if="${sucessoSenha}" class="alert alert-success py-2">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucessoSenha}"></span>
                    </div>
                    <div th:if="${erroSenha}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erroSenha}"></span>
                    </div>
                    <form th:action="@{/perfil/senha}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Senha Atual</label>
                            <div class="input-group">
                                <input type="password" name="senhaAtual" id="senhaAtual"
                                       class="form-control" required/>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePwd('senhaAtual','i1')">
                                    <i id="i1" class="bi bi-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nova Senha</label>
                            <div class="input-group">
                                <input type="password" name="novaSenha" id="novaSenha"
                                       class="form-control" required minlength="6"/>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePwd('novaSenha','i2')">
                                    <i id="i2" class="bi bi-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirmar Nova Senha</label>
                            <div class="input-group">
                                <input type="password" name="confirmarSenha" id="confirmarSenha"
                                       class="form-control" required minlength="6"/>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePwd('confirmarSenha','i3')">
                                    <i id="i3" class="bi bi-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger fw-semibold w-100">
                            <i class="bi bi-lock me-2"></i>Alterar Senha
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePwd(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        input.type  = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
    }
</script>
<script th:replace="~{fragments/layout :: sidebar-scripts}"></script>
</div><!-- fim main-wrapper -->
</body>
</html>
