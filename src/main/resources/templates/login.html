<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | Controle Car</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .logo-icon { font-size: 3rem; color: #ffc107; }
        .btn-login { background: #ffc107; border: none; color: #000; font-weight: 600; }
        .btn-login:hover { background: #e0a800; color: #000; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container" style="max-width: 420px;">
        <div class="card login-card border-0 p-4">
            <div class="text-center mb-4">
                <i class="bi bi-car-front-fill logo-icon"></i>
                <h3 class="fw-bold mt-2 mb-0">Controle Car</h3>
                <small class="text-muted">Sistema de Gestão de Veículos</small>
            </div>

            <div th:if="${erro}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}"></span>
            </div>
            <div th:if="${sucesso}" class="alert alert-success py-2">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${sucesso}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" id="senhaInput" class="form-control" placeholder="Digite sua senha" required/>
                        <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                            <i id="olhoSenha" class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <!-- remember-me sempre ativo automaticamente -->
                <input type="hidden" name="remember-me" value="on"/>
                <div class="mb-4 text-end">
                    <a href="/esqueci-senha" class="text-muted small text-decoration-none">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn btn-login w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>
        </div>
    </div>
    <script>
        function toggleSenha() {
            const input = document.getElementById('senhaInput');
            const icon = document.getElementById('olhoSenha');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        }
    </script>
</body>
</html>
