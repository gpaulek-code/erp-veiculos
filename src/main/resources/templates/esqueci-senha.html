<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Esqueci minha senha | Controle Car</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .logo-icon { font-size: 3rem; color: #ffc107; }
        .btn-enviar { background: #ffc107; border: none; color: #000; font-weight: 600; }
        .btn-enviar:hover { background: #e0a800; color: #000; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container" style="max-width: 420px;">
        <div class="card border-0 p-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <i class="bi bi-car-front-fill logo-icon"></i>
                <h3 class="fw-bold mt-2 mb-0">Controle Car</h3>
            </div>

            <!-- Título -->
            <h5 class="fw-bold mb-1">Esqueceu a senha?</h5>
            <p class="text-muted small mb-4">
                Não se preocupe! Digite o e-mail cadastrado e enviaremos as instruções para redefinir sua senha.
            </p>

            <div th:if="${sucesso}" class="alert alert-success py-2">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erro}"></span>
            </div>

            <form th:action="@{/esqueci-senha}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-mail <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control form-control-lg"
                           placeholder="seu@email.com" required autofocus/>
                </div>
                <button type="submit" class="btn btn-enviar w-100 py-2 mb-3">
                    <i class="bi bi-envelope-fill me-2"></i>Enviar instruções
                </button>
            </form>

            <div class="text-center">
                <a th:href="@{/login}" class="text-decoration-none text-primary">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
