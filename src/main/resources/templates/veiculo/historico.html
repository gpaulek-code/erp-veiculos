<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Histórico de Movimentações')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div id="main-wrapper">


<main class="container py-4 flex-grow-1">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <i class="bi bi-clock-history fs-3 text-primary me-3"></i>
            <div>
                <h2 class="mb-0 fw-bold">Histórico de Movimentações</h2>
                <small class="text-muted"
                       th:text="${veiculo.marca + ' ' + veiculo.modelo + ' — ' + veiculo.placa}">
                </small>
            </div>
        </div>
        <a th:href="@{/veiculos/{id}(id=${veiculo.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <!-- Alertas -->
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="row g-4">

        <!-- ═══ Formulário: nova movimentação ══════════════════════════ -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-0 pt-3">
                    <h6 class="fw-bold mb-0">
                        <i class="bi bi-arrow-left-right me-2 text-primary"></i>Registrar Movimentação
                    </h6>
                </div>
                <div class="card-body">

                    <!-- Status atual -->
                    <div class="mb-3 p-3 bg-light rounded">
                        <small class="text-muted d-block mb-1">Status atual</small>
                        <span th:text="${veiculo.statusDescricao}"
                              th:classappend="${veiculo.status.name() == 'VENDIDO'}     ? 'badge bg-danger fs-6'     :
                                              (${veiculo.status.name() == 'MANUTENCAO'} ? 'badge bg-warning text-dark fs-6' :
                                              'badge bg-success fs-6')"
                              class="badge fs-6">
                        </span>
                    </div>

                    <form th:action="@{/veiculos/{id}/movimentacoes(id=${veiculo.id})}"
                          th:object="${form}"
                          method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Novo Status <span class="text-danger">*</span>
                            </label>
                            <select th:field="*{statusNovo}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('statusNovo')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="s : ${statusList}"
                                        th:value="${s.name()}"
                                        th:text="${s.descricao}"
                                        th:disabled="${s == veiculo.status}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{statusNovo}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Observação</label>
                            <textarea th:field="*{observacao}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('observacao')} ? 'is-invalid'"
                                      rows="3"
                                      placeholder="Ex: Transferido para revisão de freios..."></textarea>
                            <div class="invalid-feedback" th:errors="*{observacao}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-lg me-1"></i>Confirmar Movimentação
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ═══ Timeline de movimentações ═══════════════════════════════ -->
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-3">
                    <h6 class="fw-bold mb-0">
                        <i class="bi bi-list-check me-2 text-primary"></i>
                        Histórico
                        <span class="badge bg-secondary ms-1"
                              th:text="${#lists.size(movimentacoes)}">0</span>
                    </h6>
                </div>
                <div class="card-body p-0">

                    <!-- Sem histórico -->
                    <div th:if="${#lists.isEmpty(movimentacoes)}"
                         class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Nenhuma movimentação registrada.
                    </div>

                    <!-- Timeline -->
                    <ul th:if="${!#lists.isEmpty(movimentacoes)}"
                        class="list-group list-group-flush">
                        <li th:each="mov : ${movimentacoes}"
                            class="list-group-item px-4 py-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <!-- Seta de status -->
                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <!-- Status anterior (pode ser nulo no cadastro) -->
                                        <span th:if="${mov.statusAnterior != null}"
                                              th:text="${mov.statusAnteriorDescricao}"
                                              class="badge bg-secondary">
                                        </span>
                                        <span th:if="${mov.statusAnterior != null}">
                                            <i class="bi bi-arrow-right text-muted"></i>
                                        </span>
                                        <span th:text="${mov.statusNovoDescricao}"
                                              th:classappend="${mov.statusNovo.name() == 'VENDIDO'}     ? 'badge bg-danger'     :
                                                              (${mov.statusNovo.name() == 'MANUTENCAO'} ? 'badge bg-warning text-dark' :
                                                              'badge bg-success')"
                                              class="badge">
                                        </span>
                                    </div>

                                    <!-- Observação -->
                                    <small th:if="${mov.observacao != null and !mov.observacao.isBlank()}"
                                           class="text-muted"
                                           th:text="${mov.observacao}">
                                    </small>
                                    <small th:if="${mov.observacao == null or mov.observacao.isBlank()}"
                                           class="text-muted fst-italic">
                                        Sem observação
                                    </small>
                                </div>

                                <!-- Data/hora -->
                                <small class="text-muted text-nowrap ms-3">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${#temporals.format(mov.registradoEm, 'dd/MM/yyyy HH:mm')}"></span>
                                </small>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/layout :: sidebar-scripts}"></script>
</div><!-- fim main-wrapper -->
</body>
</html>
