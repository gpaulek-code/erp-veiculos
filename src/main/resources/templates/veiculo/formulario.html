<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div id="main-wrapper">


<main class="container py-4 flex-grow-1">

    <!-- Cabeçalho -->
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-car-front fs-3 text-primary me-3"></i>
        <div>
            <h2 class="mb-0 fw-bold" th:text="${titulo}">Veículo</h2>
            <small class="text-muted">Preencha os dados abaixo</small>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <form th:action="${veiculo.id != null} ? @{/veiculos/{id}/editar(id=${veiculo.id})} : @{/veiculos/novo}"
                  th:object="${veiculo}"
                  method="post"
                  novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">

                    <!-- Placa -->
                    <div class="col-12 col-md-3">
                        <label class="form-label fw-semibold">Placa <span class="text-danger">*</span></label>
                        <input type="text"
                               th:field="*{placa}"
                               class="form-control text-uppercase"
                               th:classappend="${#fields.hasErrors('placa')} ? 'is-invalid'"
                               placeholder="Ex: ABC1D23"
                               maxlength="8"/>
                        <div class="invalid-feedback" th:errors="*{placa}"></div>
                    </div>

                    <!-- Marca -->
                    <div class="col-12 col-md-3">
                        <label class="form-label fw-semibold">Marca <span class="text-danger">*</span></label>
                        <input type="text"
                               th:field="*{marca}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'"
                               placeholder="Ex: Volkswagen"/>
                        <div class="invalid-feedback" th:errors="*{marca}"></div>
                    </div>

                    <!-- Modelo -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold">Modelo <span class="text-danger">*</span></label>
                        <input type="text"
                               th:field="*{modelo}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'"
                               placeholder="Ex: Gol 1.0"/>
                        <div class="invalid-feedback" th:errors="*{modelo}"></div>
                    </div>

                    <!-- Ano -->
                    <div class="col-12 col-md-2">
                        <label class="form-label fw-semibold">Ano <span class="text-danger">*</span></label>
                        <input type="number"
                               th:field="*{ano}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('ano')} ? 'is-invalid'"
                               placeholder="2024"
                               min="1950" max="2100"/>
                        <div class="invalid-feedback" th:errors="*{ano}"></div>
                    </div>

                    <!-- Cor -->
                    <div class="col-12 col-md-3">
                        <label class="form-label fw-semibold">Cor <span class="text-danger">*</span></label>
                        <input type="text"
                               th:field="*{cor}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('cor')} ? 'is-invalid'"
                               placeholder="Ex: Branco"/>
                        <div class="invalid-feedback" th:errors="*{cor}"></div>
                    </div>
                    </div>

                    <!-- Valor com FIPE -->
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold">Valor (R$) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number"
                                   th:field="*{valor}"
                                   id="campoValor"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'"
                                   placeholder="0.00"
                                   step="0.01" min="0.01"/>
                            <button type="button" class="btn btn-outline-warning" onclick="buscarFipe()" title="Buscar preço FIPE">
                                <i class="bi bi-search"></i> FIPE
                            </button>
                            <div class="invalid-feedback" th:errors="*{valor}"></div>
                        </div>
                        <div id="fipeInfo" class="mt-1" style="font-size:.78rem;"></div>
                    </div>

                    <!-- Status -->
                    <div class="col-12 col-md-3">
                        <label class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                        <select th:field="*{status}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="s : ${statusList}"
                                    th:value="${s.name()}"
                                    th:text="${s.descricao}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{status}"></div>
                    </div>

                </div>

                <!-- Botões -->
                <div class="d-flex gap-2 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check-lg me-1"></i>Salvar
                    </button>
                    <a th:href="@{/veiculos}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelector('input[name="placa"]')
        .addEventListener('input', function () {
            this.value = this.value.toUpperCase();
        });

    async function buscarFipe() {
        const marca  = document.querySelector('input[name="marca"]').value.trim();
        const modelo = document.querySelector('input[name="modelo"]').value.trim();
        const ano    = document.querySelector('input[name="ano"]').value.trim();
        const info   = document.getElementById('fipeInfo');

        if (!marca || !modelo || !ano) {
            info.innerHTML = '<span class="text-danger"><i class="bi bi-exclamation-triangle me-1"></i>Preencha Marca, Modelo e Ano primeiro.</span>';
            return;
        }

        info.innerHTML = '<span class="text-muted"><i class="bi bi-hourglass-split me-1"></i>Buscando na tabela FIPE...</span>';

        try {
            const BASE = 'https://parallelum.com.br/fipe/api/v1';

            // Buscar marcas
            const marcasRes = await fetch(`${BASE}/carros/marcas`);
            const marcas = await marcasRes.json();
            const marcaObj = marcas.find(m => m.nome.toLowerCase().includes(marca.toLowerCase()));
            if (!marcaObj) throw new Error(`Marca "${marca}" não encontrada na FIPE`);

            // Buscar modelos
            const modelosRes = await fetch(`${BASE}/carros/marcas/${marcaObj.codigo}/modelos`);
            const modelosData = await modelosRes.json();
            const modeloObj = modelosData.modelos.find(m =>
                m.nome.toLowerCase().includes(modelo.toLowerCase().split(' ')[0])
            );
            if (!modeloObj) throw new Error(`Modelo "${modelo}" não encontrado na FIPE`);

            // Buscar anos
            const anosRes = await fetch(`${BASE}/carros/marcas/${marcaObj.codigo}/modelos/${modeloObj.codigo}/anos`);
            const anos = await anosRes.json();
            const anoObj = anos.find(a => a.nome.startsWith(ano)) || anos[0];
            if (!anoObj) throw new Error('Ano não encontrado na FIPE');

            // Buscar preço
            const precoRes = await fetch(`${BASE}/carros/marcas/${marcaObj.codigo}/modelos/${modeloObj.codigo}/anos/${anoObj.codigo}`);
            const preco = await precoRes.json();

            const valorNumerico = preco.Valor.replace('R$ ', '').replace('.', '').replace(',', '.');
            document.getElementById('campoValor').value = parseFloat(valorNumerico).toFixed(2);

            info.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>
                FIPE: <strong>${preco.Valor}</strong> &mdash;
                ${preco.Marca} ${preco.Modelo} ${preco.AnoModelo} &mdash;
                <small class="text-muted">Ref: ${preco.MesReferencia}</small>
            </span>`;

        } catch (e) {
            info.innerHTML = `<span class="text-warning"><i class="bi bi-exclamation-circle me-1"></i>${e.message}</span>`;
        }
    }
</script>
<script th:replace="~{fragments/layout :: sidebar-scripts}"></script>
</div><!-- fim main-wrapper -->
</body>
</html>
