<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Veículos')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div id="main-wrapper">


<main class="container py-4 flex-grow-1">

    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <i class="bi bi-list-ul fs-3 text-primary me-3"></i>
            <div>
                <h2 class="mb-0 fw-bold">Veículos</h2>
                <small class="text-muted">Gerencie o estoque</small>
            </div>
        </div>
        <a th:href="@{/veiculos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Novo Veículo
        </a>
    </div>

    <!-- Alertas -->
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <!-- ═══ Filtros ═══════════════════════════════════════════════════ -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/veiculos}" method="get" class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Placa</label>
                    <input type="text" name="placa" class="form-control"
                           placeholder="Ex: ABC1234"
                           th:value="${placa}"/>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Modelo</label>
                    <input type="text" name="modelo" class="form-control"
                           placeholder="Ex: Civic"
                           th:value="${modelo}"/>
                </div>
                <div class="col-12 col-md-2">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        <option value="">Todos</option>
                        <option th:each="s : ${statusList}"
                                th:value="${s.name()}"
                                th:text="${s.descricao}"
                                th:selected="${s == statusSelecionado}">
                        </option>
                    </select>
                </div>
                <div class="col-12 col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search me-1"></i>Filtrar
                    </button>
                    <a th:href="@{/veiculos}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══ Tabela ════════════════════════════════════════════════════ -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <!-- Sem resultados -->
            <div th:if="${veiculos.isEmpty()}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                Nenhum veículo encontrado.
            </div>

            <!-- Tabela responsiva -->
            <div th:if="${!veiculos.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Cor</th>
                        <th>Valor</th>
                        <th>Status</th>
                                    <th>Dias</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${veiculos}">
                        <td class="fw-semibold" th:text="${v.placa}">-</td>
                        <td th:text="${v.marca}">-</td>
                        <td th:text="${v.modelo}">-</td>
                        <td th:text="${v.ano}">-</td>
                        <td th:text="${v.cor}">-</td>
                        <td th:text="${#numbers.formatInteger(v.quilometragem, 1, 'COMMA') + ' km'}">-</td>
                        <td th:text="${#numbers.formatCurrency(v.valor)}">-</td>
                        <td>
                            <span th:text="${v.statusDescricao}"
                                  th:classappend="${v.status.name() == 'VENDIDO'}    ? 'badge bg-danger'    :
                                                  (${v.status.name() == 'MANUTENCAO'} ? 'badge bg-warning text-dark' :
                                                  'badge bg-success')"
                                  class="badge">
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/veiculos/{id}(id=${v.id})}"
                                   class="btn btn-outline-secondary" title="Detalhes">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/veiculos/{id}/movimentacoes(id=${v.id})}"
                                   class="btn btn-outline-info" title="Histórico">
                                    <i class="bi bi-clock-history"></i>
                                </a>
                                <a th:href="@{/veiculos/{id}/editar(id=${v.id})}"
                                   class="btn btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button"
                                        class="btn btn-outline-danger"
                                        title="Excluir"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalExcluir"
                                        th:attr="data-id=${v.id}, data-placa=${v.placa}"
                                        onclick="prepararExclusao(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- ═══ Paginação ══════════════════════════════════════════ -->
            <div th:if="${veiculos.totalPages > 1}"
                 class="d-flex justify-content-between align-items-center px-3 py-2 border-top">

                <small class="text-muted"
                       th:text="'Exibindo ' + ${veiculos.numberOfElements} + ' de ' + ${veiculos.totalElements} + ' registros'">
                </small>

                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${veiculos.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/veiculos(page=${veiculos.number - 1}, placa=${placa}, modelo=${modelo}, status=${statusSelecionado})}">
                                &laquo;
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, veiculos.totalPages - 1)}"
                            class="page-item"
                            th:classappend="${i == veiculos.number} ? 'active'">
                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="@{/veiculos(page=${i}, placa=${placa}, modelo=${modelo}, status=${statusSelecionado})}">
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${veiculos.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/veiculos(page=${veiculos.number + 1}, placa=${placa}, modelo=${modelo}, status=${statusSelecionado})}">
                                &raquo;
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>

<!-- ═══ Modal de confirmação de exclusão ══════════════════════════════ -->
<div class="modal fade" id="modalExcluir" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center py-4 px-4">
                <div class="mb-3">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2.5rem;"></i>
                </div>
                <h5 class="fw-bold mb-2">Excluir veículo?</h5>
                <p class="text-muted mb-4">
                    Tem certeza que deseja excluir o veículo de placa
                    <strong id="placaExcluir" class="text-dark"></strong>?
                    <br><small>Esta ação não pode ser desfeita.</small>
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <button type="button" class="btn btn-outline-secondary px-4"
                            data-bs-dismiss="modal">
                        Não
                    </button>
                    <form id="formExcluir" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger px-4">
                            Sim, excluir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function prepararExclusao(btn) {
        const id    = btn.getAttribute('data-id');
        const placa = btn.getAttribute('data-placa');
        document.getElementById('placaExcluir').textContent = placa;
        document.getElementById('formExcluir').action = '/veiculos/' + id + '/excluir';
    }
</script>
<script th:replace="~{fragments/layout :: sidebar-scripts}"></script>
</div><!-- fim main-wrapper -->
</body>
</html>
