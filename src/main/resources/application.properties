# ===========================
# Configurações da Aplicação
# ===========================
spring.application.name=controle-car
server.port=8080

# ===========================
# Banco de Dados - H2 Local (Arquivo persistente em ./data)
# ===========================
spring.datasource.url=jdbc:h2:file:./data/erp_veiculos;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Se quiser usar PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/erp_veiculos
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexões HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# Thymeleaf
# ===========================
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# ===========================
# Internacionalização pt-BR
# ===========================
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# ===========================
# Paginação padrão
# ===========================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

# ===========================
# Logging
# ===========================
logging.level.com.revendaauto=INFO
logging.level.org.springframework.web=WARN

# Upload de arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
