# ===================================================
# Profile: dev
# Ative com: -Dspring.profiles.active=dev
# ou na IDE: Edit Configurations > Active profiles: dev
# ===================================================

# Banco local de desenvolvimento
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_veiculos_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

# Recria o schema a cada restart (útil em dev)
spring.jpa.hibernate.ddl-auto=create-drop

# Mostra SQL formatado
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging detalhado
logging.level.com.revendaauto=DEBUG
logging.level.org.hibernate.SQL=DEBUG
